name: Bug report
description: Something in ApexDiagram is broken or behaves unexpectedly.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. This tracker is public, so please leave out diagram exports, device inventories, credentials and anything else confidential.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen instead.
      placeholder: When I drag a switch onto a rack the link lines disappear. I expected them to follow the device.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps so we can see the same thing you saw.
      placeholder: |
        1. Open a diagram with at least one rack
        2. Drag a device from the palette onto the rack
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of ApexDiagram is affected?
      options:
        - Canvas and diagramming
        - Devices, racks and links
        - Virtual machines and clusters
        - Assets and inventory
        - Lint and assistant rules
        - Sharing, comments and access
        - Import and export
        - Account, billing and sign-in
        - Admin and organisation settings
        - Blog, docs or marketing site
        - Other
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Blocks me from working
        - Workaround exists but it is painful
        - Minor annoyance
        - Cosmetic
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Chrome 130 on Windows 11
    validations:
      required: true
  - type: input
    id: when
    attributes:
      label: When did it happen?
      description: Approximate date and time with your time zone helps us find it in the logs.
      placeholder: 2026-10-20 14:30 AEDT
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, recordings or anything else
      description: Drag images or video into this box.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: This report contains no confidential data.
          required: true
